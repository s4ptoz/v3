<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📅 Penanda Waktu</title>
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            color: #1e293b;
        }
        .app {
            max-width: 720px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .header p {
            color: #64748b;
            font-size: 1rem;
            margin-top: 0.3rem;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid rgba(255,255,255,0.7);
            margin-bottom: 2rem;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: flex-end;
        }
        .form-group {
            flex: 1 1 180px;
            min-width: 140px;
        }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: #64748b;
            margin-bottom: 0.3rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #1e293b;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }
        .btn-add {
            flex: 0 0 auto;
            padding: 0.7rem 1.8rem;
            background: linear-gradient(135deg, #2563eb, #6d28d9);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 14px rgba(37,99,235,0.3);
            white-space: nowrap;
        }
        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(37,99,235,0.35);
        }
        .btn-add:active { transform: translateY(0); }
        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: #94a3b8;
        }
        .empty-state .icon { font-size: 3.5rem; margin-bottom: 0.8rem; opacity: 0.6; }
        .empty-state h3 { font-weight: 600; color: #475569; font-size: 1.1rem; }
        .empty-state p { font-size: 0.9rem; margin-top: 0.3rem; }
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .event-card {
            background: white;
            border-radius: 18px;
            padding: 1.2rem 1.8rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
            border: 1px solid rgba(226,232,240,0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            transition: transform 0.15s, box-shadow 0.2s;
            animation: slideUp 0.35s ease-out;
        }
        .event-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.07);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .event-info { flex: 1 1 200px; min-width: 150px; }
        .event-name { font-size: 1.15rem; font-weight: 700; color: #0f172a; line-height: 1.3; }
        .event-date { font-size: 0.85rem; color: #64748b; font-weight: 500; margin-top: 0.1rem; }
        .event-date span { background: #f1f5f9; padding: 0.1rem 0.6rem; border-radius: 6px; font-size: 0.75rem; font-weight: 600; color: #475569; margin-left: 0.3rem; }
        .event-badge { flex: 0 0 auto; text-align: right; min-width: 100px; }
        .event-days { font-size: 2.8rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; transition: color 0.3s; }
        .event-days.future { color: #2563eb; }
        .event-days.past { color: #dc2626; }
        .event-days.today { color: #16a34a; }
        .event-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-top: 0.15rem; }
        .event-actions { flex: 0 0 auto; display: flex; gap: 0.4rem; }
        .btn-delete {
            background: none;
            border: none;
            color: #cbd5e1;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
            line-height: 1;
        }
        .btn-delete:hover { color: #dc2626; background: #fef2f2; }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .form-card { padding: 1.2rem 1.2rem; }
            .form-row { flex-direction: column; align-items: stretch; }
            .form-group { flex: 1 1 auto; min-width: unset; }
            .btn-add { width: 100%; justify-content: center; text-align: center; padding: 0.8rem; }
            .event-card { padding: 1rem 1.2rem; flex-direction: column; align-items: stretch; text-align: center; }
            .event-badge { text-align: center; }
            .event-days { font-size: 2.4rem; }
            .event-actions { justify-content: center; margin-top: 0.2rem; }
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: #0f172a;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 16px;
            font-weight: 500;
            font-size: 0.9rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            z-index: 999;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .footer { text-align: center; margin-top: 2.5rem; font-size: 0.8rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>📅 Penanda Waktu</h1>
            <p>Hitung hari menuju atau sejak tanggal spesialmu</p>
        </header>
        <section class="form-card">
            <form id="eventForm" class="form-row">
                <div class="form-group">
                    <label for="eventName">Nama Acara</label>
                    <input type="text" id="eventName" placeholder="Misal: Ultah ke-28" required />
                </div>
                <div class="form-group">
                    <label for="eventDate">Tanggal</label>
                    <input type="date" id="eventDate" required />
                </div>
                <button type="submit" class="btn-add">➕ Tambah</button>
            </form>
        </section>
        <div id="eventList" class="event-list"></div>
        <div class="footer"><span>✦ data tersimpan di database ✦</span></div>
    </div>
    <div id="toast" class="toast"></div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const API_URL = '/api'; // pastikan api.php di folder yang sama
        let events = [];

        function generateId() {
            return crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2, 8);
        }
        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T00:00:00');
            return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        }
        function getDayDifference(dateStr) {
            const today = new Date(); today.setHours(0,0,0,0);
            const target = new Date(dateStr + 'T00:00:00');
            return Math.round((target - today) / (1000*60*60*24));
        }
        function getDayOfWeek(dateStr) {
            const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            return days[new Date(dateStr+'T00:00:00').getDay()];
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadEvents() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error('Gagal fetch');
                events = await res.json();
                renderEvents();
            } catch (err) {
                showToast('⚠️ Gagal terhubung ke server. Cek api.php');
            }
        }

        async function addEvent(name, date) {
            const newEvent = { id: generateId(), name: name.trim(), date };
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newEvent)
                });
                if (res.ok) {
                    showToast('✅ Data tersimpan di database!');
                    loadEvents();
                    return true;
                } else {
                    const err = await res.json();
                    showToast('❌ Gagal simpan: ' + (err.error || 'Server error'));
                    return false;
                }
            } catch (err) {
                showToast('❌ Gagal konek ke server');
                return false;
            }
        }

        async function deleteEvent(id) {
            try {
                const res = await fetch(API_URL + '?id=' + id, { method: 'DELETE' });
                if (res.ok) {
                    showToast('🗑️ Data dihapus dari database');
                    loadEvents();
                } else {
                    showToast('❌ Gagal hapus data');
                }
            } catch (err) {
                showToast('❌ Gagal konek ke server');
            }
        }

        function renderEvents() {
            const container = document.getElementById('eventList');
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <h3>Belum ada acara</h3>
                        <p>Tambahkan acara spesialmu di atas ✨</p>
                    </div>
                `;
                return;
            }
            const sorted = [...events].sort((a,b) => new Date(a.date+'T00:00:00') - new Date(b.date+'T00:00:00'));
            let html = '';
            for (const ev of sorted) {
                const diff = getDayDifference(ev.date);
                const displayDiff = -diff;
                let daysClass = 'future';
                let labelDetail = '';
                if (diff === 0) {
                    daysClass = 'today';
                    labelDetail = 'Hari ini!';
                } else if (diff < 0) {
                    daysClass = 'past';
                    const d = Math.abs(diff);
                    labelDetail = d === 1 ? '1 hari yang lalu' : d + ' hari yang lalu';
                } else {
                    daysClass = 'future';
                    labelDetail = diff === 1 ? '1 hari lagi' : diff + ' hari lagi';
                }
                const sign = displayDiff > 0 ? '+' : '';
                const displayNumber = displayDiff === 0 ? '0' : sign + displayDiff;

                html += `
                    <div class="event-card">
                        <div class="event-info">
                            <div class="event-name">${escapeHtml(ev.name)}</div>
                            <div class="event-date">
                                ${formatDate(ev.date)}
                                <span>${getDayOfWeek(ev.date)}</span>
                            </div>
                        </div>
                        <div class="event-badge">
                            <div class="event-days ${daysClass}">${displayNumber}</div>
                            <div class="event-label">${labelDetail}</div>
                        </div>
                        <div class="event-actions">
                            <button class="btn-delete" data-id="${ev.id}" title="Hapus">✕</button>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
            container.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    if (confirm('Yakin hapus acara ini?')) deleteEvent(id);
                });
            });
        }

        let toastTimer = null;
        function showToast(message) {
            const el = document.getElementById('toast');
            el.textContent = message;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
        }

        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('eventName');
            const dateInput = document.getElementById('eventDate');
            const name = nameInput.value.trim();
            const date = dateInput.value;
            if (!name) { showToast('⚠️ Masukkan nama acara.'); nameInput.focus(); return; }
            if (!date) { showToast('⚠️ Pilih tanggal.'); dateInput.focus(); return; }
            addEvent(name, date);
            nameInput.value = '';
            dateInput.value = '';
            nameInput.focus();
        });

        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const future = new Date(today); future.setDate(today.getDate() + 7);
            document.getElementById('eventDate').value = future.toISOString().split('T')[0];
            loadEvents();
            setInterval(() => loadEvents(), 30000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) loadEvents(); });
        });
    </script>
</body>
</html>
